<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENAI - Mídia Social</title>
    <link rel="stylesheet" href="paginaMensagem.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
</head>
<body>
    <header>
        <div class="logo">
            <img src="insiraaqui" alt="Logo">
        </div>

        <div class="botoesIniciais"> 
            <a href="paginaInicial.html"><button id="botao-paginicial"> Página Inicial</button></a> 
            <button id="botao-Mensagens">Mensagem</button> 
            <button id="botao-publicacoes">Publicações</button> 
            <a href="paginaPerfil.html"><button id="botao-meuperfil">Meu Perfil</button></a> 
            <a href="configuracoes-seguranca.html"><button id="botao-configurações">Configurações</button></a> 
            <button id="botao-publicar">Publicar</button> 
        </div>

        <button class="profilepicture1"></button>
    </header>


    <!--Imagem fundo-->
    <img class="imgFundo" src ="img/msg2.png">

    <!--Bloco das mensagens-->
    <div class="mensagens">

        <!--Bloco de pesquisa/nome usuario-->
        <div class="buscaPerfil">
            <h2>Nome do Perfil</h2>
            <input type="text" id="botaoPesquisar" name="botaoPesquisar" placeholder="Pesquisa">
        </div>

        <div class="mensagens2" id="listaContatos">
            <!-- Fica vazio aqui! O JavaScript vai preencher automaticamente -->
        </div>

    </div>

        <!-- Insira este bloco logo abaixo da div .mensagens -->
        <div class="chatContainer" id="chatContainer">
            <div class="chatHeader">
                <img id="chatFotoPerfil" src="img/profilepicture3.png" alt="Foto Perfil">
                <h3 id="chatNomeUsuario">Nome de usuário</h3>
            </div>
            
            <div class="chatMensagens" id="chatMensagens">
            <!-- As bolhas de mensagem entram aqui via JS -->
            </div>
            
            <div class="chatInputContainer">
                <input type="text" id="inputMensagem" placeholder="Escreva uma mensagem...">
                <button id="btnEnviar">Enviar</button>
        </div>



    </div>

    <script src="paginaMensagem.js"></script>
</body>
</html>
